[package]
name = "haki"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "haki"
path = "src/haki.rs"
[build-dependencies]
cc = "1.0"
bindgen = "0.73.2"

[dependencies]
clap = { 
    version = "4.0",
    features = ["derive"] 
}
display-info = "0.5.10"
thiserror = "2.0.21"
walkdir = "2.5.0"
